name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx next build

  database:
    name: pgTAP, integration and end-to-end tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - run: npm ci
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - name: pgTAP tests
        run: supabase test db
      - name: Write .env.local for integration tests
        run: |
          supabase status -o env | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p'             -e 's/^MAILPIT_URL=/MAILPIT_URL=/p' > .env.local
          echo "CRON_SECRET=ci-$(openssl rand -hex 16)" >> .env.local
          cut -d= -f1 .env.local
      - name: Integration tests
        run: npm run test:integration
      - name: Seed demo data
        run: npm run seed:demo
      - name: Build
        run: npx next build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
